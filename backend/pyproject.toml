[project]
name = "applytrail"
version = "0.1.0"
description = "Local-first job application tracker with failure-point analytics"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP045", "UP007"]  # FastAPI Depends() defaults; SQLModel needs Optional[...]
